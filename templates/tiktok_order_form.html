<!DOCTYPE html>
<html>
<head>
  <title>TikTok Order - {{ product.get('name') }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{font-family:Arial;background:#f1f5f9;margin:0}
    .header{background:#0f172a;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
    .header a{color:#fff;text-decoration:none;font-weight:bold;opacity:.9}
    .wrap{max-width:720px;margin:18px auto;padding:0 12px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
    .title{font-size:18px;font-weight:bold}
    .sub{color:#64748b;margin-top:6px}

    label{display:block;margin-top:12px;font-size:13px;color:#334155;font-weight:bold}
    input,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid #d1d5db;font-size:14px;box-sizing:border-box}
    .btn{margin-top:14px;width:100%;padding:12px;border-radius:12px;border:none;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(max-width:650px){ .row{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <div class="header">
    <div><b>TikTok Order Page</b></div>
    <div><a href="/tiktok">← Back to TikTok Store</a></div>
  </div>

  <div class="wrap">
    <div class="card">
      <div class="title">{{ product.get('name') }}</div>
      <div class="sub">Code: {{ product.get('code') }} | Price: Rs {{ product.get('price') }}</div>

      <form method="POST" action="/tiktok-order">
        <input type="hidden" name="code" value="{{ product.get('code') }}">

        <div class="row">
          <div>
            <label>Customer Name</label>
            <input name="customer_name" required>
          </div>
          <div>
            <label>Phone</label>
            <input name="phone" required>
          </div>
        </div>

        <label>Address</label>
        <textarea name="address" rows="3" required></textarea>

        <label>Quantity</label>
        <input type="number" name="qty" min="1" value="1" required>

        <button class="btn" type="submit">Submit TikTok Order (WhatsApp)</button>
      </form>
    </div>
  </div>
</body>
</html>
