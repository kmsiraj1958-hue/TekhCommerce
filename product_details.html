<!DOCTYPE html>
<html>
<head>
    <title>Shop | Products</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f3f6;
            margin: 0;
            padding: 0;
        }
        h1 {
            text-align: center;
            padding: 20px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }
        .card img {
            max-width: 180px;
            height: 180px;
            object-fit: contain;
            margin-bottom: 10px;
        }
        .card h3 {
            margin: 5px 0;
        }
        .card p {
            margin: 5px 0;
            color: #666;
        }
        .btn {
            display: inline-block;
            padding: 8px 12px;
            margin-top: 10px;
            background: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn:hover {
            background: #218838;
        }
    </style>
</head>
<body>

<h1>🛒 Our Products</h1>

<div class="grid">

    {% for product in products %}
    <div class="card">
        <img src="/static/images/{{ product['image'] }}" 
             alt="{{ product['name'] }}" 
             onerror="this.src='/static/images/no-image.png'">
        <h3>{{ product['name'] }}</h3>
        <p>Category: {{ product['category'] }}</p>
        <p>Price: Rs {{ product['price'] }}</p>
        
        <a class="btn"
           href="https://wa.me/{{ whatsapp_number }}?text={{ 'Hello, I want to order ' + product['name'] + ' (Code: ' + product['code'] + ').' | urlencode }}">
            Order Now
        </a>
    </div>
    {% endfor %}

</div>

</body>
</html>
