<!DOCTYPE html>
<html>
<head>
  <title>TikTok Khalid Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body{font-family:Arial;background:#f1f5f9;margin:0}
    .header{background:#0f172a;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
    .header a{color:#fff;text-decoration:none;font-weight:bold;opacity:.9;margin-left:14px}
    .header a:hover{opacity:1}
    .wrap{max-width:1100px;margin:18px auto;padding:0 12px}

    .topbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}
    .input,.select{padding:10px 12px;border-radius:12px;border:1px solid #d1d5db;background:#fff;font-size:14px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.05);overflow:hidden}
    .img{width:100%;height:180px;object-fit:cover;background:#f8fafc}
    .pad{padding:12px}
    .name{font-weight:bold}
    .meta{color:#64748b;font-size:13px;margin-top:6px}
    .price{margin-top:10px;font-weight:bold}

    .btnRow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    .btn{
      flex:1;
      display:block;
      text-align:center;
      padding:10px;
      border-radius:12px;
      text-decoration:none;
      color:#fff;
      font-weight:bold;
    }
    .btnOrder{background:#2563eb}
    .btnCart{background:#16a34a}
  </style>
</head>
<body>
  <div class="header">
    <div><b>TikTok Khalid Store</b></div>
    <div>
      <a href="/cart">Cart</a>
      <a href="/products" target="_blank">Public Store</a>
    </div>
  </div>

  <div class="wrap">
    <div class="topbar">
      <input id="q" class="input" placeholder="Search product...">
      <select id="cat" class="select">
        <option value="">All Categories</option>
        {% for c in categories %}
          <option value="{{ c }}">{{ c }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="grid" id="grid">
      {% for p in products %}
      <div class="card"
           data-name="{{ (p.get('name','') ~ ' ' ~ p.get('code','') ~ ' ' ~ p.get('category',''))|lower }}"
           data-cat="{{ (p.get('category','')) }}">
        {% if p.get('image') %}
          <img class="img" src="{{ url_for('static', filename='images/' ~ p.get('image')) }}" alt="">
        {% else %}
          <div class="img"></div>
        {% endif %}
        <div class="pad">
          <div class="name">{{ p.get('name') }}</div>
          <div class="meta">Code: {{ p.get('code') }} {% if p.get('category') %} | {{ p.get('category') }}{% endif %}</div>
          <div class="price">Rs {{ p.get('price') }}</div>

          <div class="btnRow">
            <a class="btn btnCart" href="/cart/add/{{ p.get('code') }}">Add to Cart</a>
            <a class="btn btnOrder" href="/tiktok/order/{{ p.get('code') }}">Order Now</a>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>

<script>
(function(){
  const q = document.getElementById("q");
  const cat = document.getElementById("cat");
  const cards = Array.from(document.querySelectorAll("#grid .card"));

  function apply(){
    const text = (q.value||"").toLowerCase().trim();
    const c = (cat.value||"").trim();

    cards.forEach(card=>{
      const hay = (card.getAttribute("data-name")||"");
      const cardCat = (card.getAttribute("data-cat")||"");
      const okText = !text || hay.includes(text);
      const okCat = !c || cardCat === c;
      card.style.display = (okText && okCat) ? "" : "none";
    });
  }

  q.addEventListener("input", apply);
  cat.addEventListener("change", apply);
})();
</script>

</body>
</html>
