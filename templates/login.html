<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    /* Reset */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Roboto', sans-serif;
        background: linear-gradient(135deg, #6b73ff 0%, #000dff 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #333;
    }

    /* Container card */
    .login-card {
        background: #fff;
        border-radius: 20px;
        width: 100%;
        max-width: 400px;
        padding: 40px 30px;
        box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        position: relative;
        overflow: hidden;
    }

    /* Decorative shapes */
    .login-card::before {
        content: '';
        position: absolute;
        width: 200px;
        height: 200px;
        background: #6b73ff;
        border-radius: 50%;
        top: -60px;
        right: -60px;
        opacity: 0.3;
    }

    .login-card::after {
        content: '';
        position: absolute;
        width: 150px;
        height: 150px;
        background: #000dff;
        border-radius: 50%;
        bottom: -50px;
        left: -50px;
        opacity: 0.3;
    }

    h2 {
        text-align: center;
        margin-bottom: 30px;
        font-weight: 700;
        color: #1e293b;
        letter-spacing: 1px;
    }

    /* Flash messages */
    .flash {
        text-align: center;
        margin-bottom: 20px;
        color: #ef4444;
        font-weight: 500;
    }

    /* Inputs */
    input {
        width: 100%;
        padding: 14px 16px;
        margin-bottom: 20px;
        border-radius: 12px;
        border: 1px solid #cbd5e1;
        font-size: 14px;
        transition: all 0.3s ease;
    }

    input:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
        outline: none;
    }

    /* Button */
    button {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        color: #fff;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    button:hover {
        background: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    /* Responsive */
    @media(max-width: 480px){
        .login-card {
            padding: 30px 20px;
        }
    }
</style>
</head>
<body>

<div class="login-card">
    <h2>Admin Login</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form method="post">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
